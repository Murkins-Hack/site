<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="targetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242424" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#121212" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridTee" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="450" fill="#0c0c0c"/>
  <rect width="600" height="450" fill="url(#gridTee)"/>
  <circle cx="300" cy="225" r="210" fill="url(#targetGlow)"/>

  <!-- Technical Reticle -->
  <g opacity="0.25">
    <circle cx="300" cy="225" r="160" fill="none" stroke="#ffffff" stroke-dasharray="3 6" stroke-width="1"/>
    <line x1="140" y1="225" x2="460" y2="225" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2 4"/>
    <text x="310" y="90" fill="#ffffff" font-family="'Space Mono', monospace" font-size="10" letter-spacing="2">VETEMENTS ARCHIVE // TRGT.04</text>
    <text x="150" y="375" fill="#ffffff" font-family="'Space Mono', monospace" font-size="9" letter-spacing="1">GSM: 340 VINTAGE WASHED COTTON</text>
  </g>

  <!-- Boxy Tee Graphic with Target Motif -->
  <g transform="translate(90, 40) scale(0.72)">
    <!-- Dropped Boxy Body -->
    <path d="M 180 145 L 75 230 L 135 295 L 195 240 L 190 480 L 410 480 L 405 240 L 465 295 L 525 230 L 420 145 C 370 178, 230 178, 180 145 Z" fill="#171717" stroke="#333" stroke-width="2"/>

    <!-- Ribbed Collar -->
    <path d="M 240 160 C 270 200, 330 200, 360 160 C 335 150, 265 150, 240 160 Z" fill="#121212" stroke="#555" stroke-width="1.8"/>

    <!-- Target Graphic (Inverted Concentric Rings) -->
    <g transform="translate(300, 310)">
      <circle cx="0" cy="0" r="85" fill="none" stroke="#ffffff" stroke-width="8"/>
      <circle cx="0" cy="0" r="55" fill="none" stroke="#ffffff" stroke-width="7"/>
      <circle cx="0" cy="0" r="28" fill="#ffffff"/>
      <circle cx="0" cy="0" r="12" fill="#171717"/>

      <!-- Crosshairs -->
      <line x1="-105" y1="0" x2="105" y2="0" stroke="#ffffff" stroke-width="2"/>
      <line x1="0" y1="-105" x2="0" y2="105" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Top Text Branding -->
    <text x="300" y="210" text-anchor="middle" fill="#ffffff" font-family="'Syne', sans-serif" font-size="24" font-weight="800" letter-spacing="6">VETEMENTS</text>
    <text x="300" y="445" text-anchor="middle" fill="#777777" font-family="'Space Mono', monospace" font-size="10" letter-spacing="3">LIMITED EDITION ARCHIVE</text>
  </g>
</svg>

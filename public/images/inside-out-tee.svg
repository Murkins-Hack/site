<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="cardGlow5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242424" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#121212" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0c0c0c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="techGrid5" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="450" fill="#0e0e0e"/>
  <rect width="600" height="450" fill="url(#techGrid5)"/>
  <circle cx="300" cy="225" r="210" fill="url(#cardGlow5)"/>

  <!-- Technical Reticle -->
  <g opacity="0.25">
    <circle cx="300" cy="225" r="160" fill="none" stroke="#ffffff" stroke-dasharray="3 6" stroke-width="1"/>
    <line x1="140" y1="225" x2="460" y2="225" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2 4"/>
    <text x="310" y="95" fill="#ffffff" font-family="Space Mono, monospace" font-size="10" letter-spacing="2">VETEMENTS ARCHIVE // ISO.05</text>
    <text x="150" y="370" fill="#ffffff" font-family="Space Mono, monospace" font-size="9" letter-spacing="1">CONSTRUCT: 96 OVERLOCK SEAMS</text>
  </g>

  <!-- Inside Out Tee Graphic -->
  <g transform="translate(90, 45) scale(0.7)">
    <!-- Dropped Asymmetric Tee Body -->
    <path d="M 180 150 L 80 230 L 140 290 L 195 240 L 190 490 L 410 470 L 405 240 L 460 290 L 520 230 L 420 150 C 370 180, 230 180, 180 150 Z" fill="#171717" stroke="#333333" stroke-width="2"/>
    
    <!-- Exposed Overlock White Seams -->
    <line x1="180" y1="150" x2="80" y2="230" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4 2"/>
    <line x1="420" y1="150" x2="520" y2="230" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4 2"/>
    <line x1="195" y1="240" x2="190" y2="490" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4 2"/>
    <line x1="405" y1="240" x2="410" y2="470" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4 2"/>
    <line x1="300" y1="175" x2="300" y2="480" stroke="#888888" stroke-width="1.8" stroke-dasharray="3 3"/>

    <!-- Ribbed Deconstructed Collar -->
    <path d="M 240 165 C 270 205, 330 205, 360 165 C 335 155, 265 155, 240 165 Z" fill="#121212" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- External Care Label Tag (White fabric with black micro text) -->
    <g transform="translate(195, 380) rotate(8)">
      <rect x="0" y="0" width="34" height="60" fill="#f0f0f0" rx="1"/>
      <line x1="5" y1="12" x2="29" y2="12" stroke="#000000" stroke-width="2"/>
      <line x1="5" y1="18" x2="25" y2="18" stroke="#000000" stroke-width="1.5"/>
      <line x1="5" y1="24" x2="28" y2="24" stroke="#000000" stroke-width="1.5"/>
      <line x1="5" y1="30" x2="20" y2="30" stroke="#000000" stroke-width="1.5"/>
      <line x1="5" y1="36" x2="26" y2="36" stroke="#000000" stroke-width="1.2"/>
    </g>

    <!-- Front Inverted Graphic -->
    <text x="300" y="270" text-anchor="middle" fill="#ffffff" font-family="Syne, sans-serif" font-size="26" font-weight="800" letter-spacing="8">INSIDE-OUT</text>
    <text x="300" y="295" text-anchor="middle" fill="#777777" font-family="Space Mono, monospace" font-size="10" letter-spacing="3">DECONSTRUCTED SEAMS</text>
    <text x="300" y="325" text-anchor="middle" fill="#555555" font-family="Space Mono, monospace" font-size="9" letter-spacing="2">ARCHIVE SPEC // NOIR</text>
  </g>
</svg>

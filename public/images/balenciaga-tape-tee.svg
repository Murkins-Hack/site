<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="tapeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242424" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#121212" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridTape" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="450" fill="#0c0c0c"/>
  <rect width="600" height="450" fill="url(#gridTape)"/>
  <circle cx="300" cy="225" r="210" fill="url(#tapeGlow)"/>

  <!-- Technical Reticle -->
  <g opacity="0.25">
    <circle cx="300" cy="225" r="160" fill="none" stroke="#ffffff" stroke-dasharray="3 6" stroke-width="1"/>
    <line x1="140" y1="225" x2="460" y2="225" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2 4"/>
    <text x="310" y="90" fill="#ffffff" font-family="'Space Mono', monospace" font-size="10" letter-spacing="2">BALENCIAGA ARCHIVE // TAPE.05</text>
    <text x="150" y="375" fill="#ffffff" font-family="'Space Mono', monospace" font-size="9" letter-spacing="1">GRAPHIC: INDUSTRIAL TAPE LOGO</text>
  </g>

  <!-- Boxy Tee with Tape Logo Motif -->
  <g transform="translate(90, 40) scale(0.72)">
    <path d="M 180 145 L 75 230 L 135 295 L 195 240 L 190 480 L 410 480 L 405 240 L 465 295 L 525 230 L 420 145 C 370 178, 230 178, 180 145 Z" fill="#151515" stroke="#333" stroke-width="2"/>
    <path d="M 240 160 C 270 200, 330 200, 360 160 C 335 150, 265 150, 240 160 Z" fill="#101010" stroke="#555" stroke-width="1.8"/>

    <!-- Tape Strip Graphic 1 (Diagonal Caution / Industrial Tape) -->
    <g transform="translate(200, 260) rotate(-8)">
      <rect x="0" y="0" width="220" height="42" fill="#d4af37" stroke="#b89728" stroke-width="1.5" opacity="0.9"/>
      <text x="110" y="27" text-anchor="middle" fill="#000000" font-family="'Syne', sans-serif" font-size="16" font-weight="800" letter-spacing="5">BALENCIAGA</text>
    </g>

    <!-- Tape Strip Graphic 2 (Crossing Tape Strip) -->
    <g transform="translate(190, 330) rotate(5)">
      <rect x="0" y="0" width="230" height="38" fill="#d4af37" stroke="#b89728" stroke-width="1.5" opacity="0.95"/>
      <text x="115" y="24" text-anchor="middle" fill="#000000" font-family="'Space Mono', monospace" font-size="11" font-weight="bold" letter-spacing="3">PARIS // 2026</text>
    </g>

    <!-- Small Front Chest Logo -->
    <text x="240" y="210" fill="#ffffff" font-family="'Space Mono', monospace" font-size="9" letter-spacing="2">BB</text>
  </g>
</svg>

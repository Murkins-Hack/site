<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="r_sole" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f1f1f"/>
      <stop offset="50%" stop-color="#0e0e0e"/>
      <stop offset="100%" stop-color="#040404"/>
    </linearGradient>
    <linearGradient id="r_tpu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#383838"/>
      <stop offset="50%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
    <linearGradient id="r_3m" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#777777"/>
      <stop offset="50%" stop-color="#d4d4d4"/>
      <stop offset="100%" stop-color="#666666"/>
    </linearGradient>
  </defs>

  <!-- Balenciaga Track.1 (All-Black) — 04 / REAR HEEL LOW ELEVATION -->
  <g transform="translate(180, 25)">
    <!-- Wide Sculpted Heel Outsole Tread Base -->
    <path d="M 60 375 C 130 385, 310 385, 380 375 C 430 365, 420 330, 390 310 C 350 295, 90 295, 50 310 C 20 330, 10 365, 60 375 Z" fill="url(#r_sole)" stroke="#2b2b2b" stroke-width="2"/>
    
    <!-- Heavy Rear Tread Lugs & Cleats -->
    <path d="M 45 330 L 80 325 L 70 360 L 30 360 Z" fill="#1c1c1c" stroke="#444" stroke-width="1.2"/>
    <path d="M 395 330 L 360 325 L 370 360 L 410 360 Z" fill="#1c1c1c" stroke="#444" stroke-width="1.2"/>
    <path d="M 90 360 L 150 365 L 145 390 L 85 388 Z" fill="#222" stroke="#444" stroke-width="1.2"/>
    <path d="M 350 360 L 290 365 L 295 390 L 355 388 Z" fill="#222" stroke="#444" stroke-width="1.2"/>
    <path d="M 170 368 L 270 368 L 265 395 L 175 395 Z" fill="#242424" stroke="#555" stroke-width="1.2"/>

    <!-- Prominent Sculpted High Heel Spoiler / Counter Platform -->
    <path d="M 80 310 C 130 230, 310 230, 360 310 C 310 325, 130 325, 80 310 Z" fill="#141414" stroke="#333" stroke-width="2"/>
    <path d="M 110 280 C 140 220, 300 220, 330 280 C 290 295, 150 295, 110 280 Z" fill="url(#r_tpu)" stroke="#444" stroke-width="1.5"/>

    <!-- Rear Twin Air Cushion Windows / Shock Pods -->
    <ellipse cx="160" cy="300" rx="24" ry="12" fill="#060606" stroke="#555" stroke-width="1.5"/>
    <ellipse cx="280" cy="300" rx="24" ry="12" fill="#060606" stroke="#555" stroke-width="1.5"/>

    <!-- Rear Exoskeleton Cage Ribs Encasing the Heel Bootie -->
    <path d="M 120 230 C 135 170, 150 140, 220 140 C 290 140, 305 170, 320 230 Z" fill="#161616" stroke="#2e2e2e" stroke-width="1.5"/>
    
    <!-- Cage Straps Crossing at the Heel Exoskeleton -->
    <path d="M 135 240 L 220 160 L 305 240" fill="none" stroke="#484848" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 155 255 L 220 185 L 285 255" fill="none" stroke="#555555" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 110 270 Q 150 190, 220 170" fill="none" stroke="#3d3d3d" stroke-width="4"/>
    <path d="M 330 270 Q 290 190, 220 170" fill="none" stroke="#3d3d3d" stroke-width="4"/>

    <!-- Padded Rear Ankle Collar Rim -->
    <path d="M 155 145 C 175 105, 265 105, 285 145 Z" fill="#202020" stroke="#3a3a3a" stroke-width="2"/>

    <!-- Central 3M Reflective Pull Loop & BB Monogram -->
    <rect x="205" y="115" width="30" height="42" rx="4" fill="url(#r_3m)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="210" y="141" fill="#000000" font-family="'Space Mono', monospace" font-size="14" font-weight="bold">BB</text>

    <!-- Lower Heel Embossed "BALENCIAGA" Typography -->
    <text x="220" y="275" text-anchor="middle" fill="#ffffff" font-family="'Syne', sans-serif" font-size="13" font-weight="800" letter-spacing="4">BALENCIAGA</text>
    <text x="220" y="290" text-anchor="middle" fill="#777777" font-family="'Space Mono', monospace" font-size="8" letter-spacing="2">TRACK.1 — REAR HEEL SPOILER</text>

    <!-- Bottom Stamp -->
    <text x="220" y="425" text-anchor="middle" fill="#ffffff" font-family="'Syne', sans-serif" font-size="15" font-weight="800" letter-spacing="4">BALENCIAGA</text>
    <text x="220" y="440" text-anchor="middle" fill="#777777" font-family="'Space Mono', monospace" font-size="9" letter-spacing="2">ARCHIVAL HEEL CHASSIS</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tq_sole" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="35%" stop-color="#1c1c1c"/>
      <stop offset="70%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="tq_tpu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#404040"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#2c2c2c"/>
    </linearGradient>
    <linearGradient id="tq_rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tq_reflect" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#777777"/>
      <stop offset="50%" stop-color="#cfcfcf"/>
      <stop offset="100%" stop-color="#555555"/>
    </linearGradient>
  </defs>

  <!-- Balenciaga Track.1 (All-Black) — 02 / 3/4 BEAUTY QUARTER (DYNAMIC) -->
  <g transform="translate(60, 25)">
    <!-- 3/4 Dynamic Sculpted Outsole with Wide Flare -->
    <path d="M 140 350 C 190 355, 300 375, 430 365 C 550 355, 620 310, 640 270 C 600 250, 520 270, 430 275 C 310 280, 210 285, 155 315 C 135 330, 130 345, 140 350 Z" fill="url(#tq_sole)" stroke="#2e2e2e" stroke-width="2"/>
    <path d="M 160 335 C 240 350, 420 355, 590 285 C 560 260, 490 265, 390 270 C 270 275, 195 285, 160 335 Z" fill="#141414" stroke="#383838" stroke-width="1.5"/>

    <!-- 3/4 Outsole Aggressive Lugs -->
    <path d="M 170 345 L 195 345 L 190 368 L 165 368 Z" fill="#202020" stroke="#444" stroke-width="1"/>
    <path d="M 230 355 L 260 355 L 255 378 L 225 378 Z" fill="#222222" stroke="#444" stroke-width="1"/>
    <path d="M 300 362 L 335 362 L 330 385 L 295 385 Z" fill="#262626" stroke="#555" stroke-width="1"/>
    <path d="M 380 362 L 415 362 L 410 382 L 375 382 Z" fill="#242424" stroke="#555" stroke-width="1"/>
    <path d="M 460 350 L 495 350 L 490 370 L 455 370 Z" fill="#202020" stroke="#444" stroke-width="1"/>
    <path d="M 540 325 L 570 325 L 565 345 L 535 345 Z" fill="#1c1c1c" stroke="#444" stroke-width="1"/>

    <!-- Heel Wedge, Cushion Unit & High Collar Cut -->
    <path d="M 155 315 C 140 240, 165 170, 240 145 C 280 135, 330 160, 340 190 C 270 220, 190 255, 155 315 Z" fill="#151515" stroke="#333" stroke-width="1.8"/>
    <ellipse cx="185" cy="285" rx="22" ry="11" fill="#070707" stroke="#4f4f4f" stroke-width="1.5"/>
    <ellipse cx="235" cy="298" rx="24" ry="11" fill="#070707" stroke="#4f4f4f" stroke-width="1.5"/>

    <!-- Upper Body Mesh with 3/4 Depth Perspective -->
    <path d="M 240 145 C 310 140, 370 170, 440 190 C 510 210, 565 228, 615 250 C 585 275, 520 275, 450 272 C 340 272, 250 245, 240 145 Z" fill="#181818" stroke="#303030" stroke-width="1.5"/>
    
    <!-- 176 Articulated Cage Overlays (3/4 Diagonal Perspective) -->
    <path d="M 260 155 L 305 285" stroke="#505050" stroke-width="6" stroke-linecap="round"/>
    <path d="M 260 155 L 305 285" stroke="url(#tq_rim)" stroke-width="1.6" stroke-linecap="round"/>

    <path d="M 315 170 L 365 280" stroke="#5a5a5a" stroke-width="6" stroke-linecap="round"/>
    <path d="M 315 170 L 365 280" stroke="url(#tq_rim)" stroke-width="1.6" stroke-linecap="round"/>

    <path d="M 375 185 L 430 275" stroke="#525252" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 440 198 L 495 268" stroke="#5d5d5d" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 505 215 L 555 260" stroke="#4f4f4f" stroke-width="5" stroke-linecap="round"/>

    <!-- Medial Inner Cage Highlights visible through 3/4 perspective -->
    <path d="M 325 140 L 350 200" stroke="#353535" stroke-width="4" stroke-linecap="round"/>
    <path d="M 380 155 L 410 215" stroke="#383838" stroke-width="4" stroke-linecap="round"/>
    <path d="M 445 175 L 475 225" stroke="#3a3a3a" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Dynamic TPU Cage Cross Struts -->
    <path d="M 280 270 L 350 178 L 415 265 L 490 198 L 565 255" fill="none" stroke="url(#tq_tpu)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 320 275 L 385 192 L 455 270 L 525 210" fill="none" stroke="#252525" stroke-width="2.5"/>

    <!-- Sculpted Toe Box Bumper with 42 Sizing Badge Plate -->
    <path d="M 555 235 C 605 238, 640 255, 645 280 C 620 295, 575 288, 545 270 Z" fill="#202020" stroke="#444" stroke-width="2"/>
    <rect x="580" y="250" width="34" height="16" rx="2" fill="#ffffff"/>
    <text x="588" y="262" fill="#000000" font-family="'Space Mono', monospace" font-size="12" font-weight="bold">42</text>

    <!-- Padded 3D Tongue, Collar Rim & Woven Double Laces -->
    <path d="M 290 140 C 320 95, 370 85, 395 115 C 375 145, 330 155, 290 140 Z" fill="#222" stroke="#444" stroke-width="2"/>
    
    <!-- Double Woven High-Contrast Laces -->
    <path d="M 360 102 L 475 205" stroke="#ffffff" stroke-width="3.2" stroke-dasharray="9 4" stroke-linecap="round"/>
    <path d="M 335 125 L 510 220" stroke="#d0d0d0" stroke-width="3" stroke-dasharray="7 4" stroke-linecap="round"/>
    <path d="M 315 145 L 545 232" stroke="#ffffff" stroke-width="2.8" stroke-dasharray="8 4" stroke-linecap="round"/>
    <path d="M 300 162 L 575 242" stroke="#a0a0a0" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/>

    <!-- Tongue 3M Reflective Rubber Patch -->
    <rect x="375" y="90" width="26" height="12" rx="2" fill="url(#tq_reflect)"/>
    <text x="378" y="99" fill="#000" font-family="'Space Mono', monospace" font-size="7" font-weight="bold">TRACK</text>

    <!-- Rear 3M Reflective Heel Tab & Loop -->
    <path d="M 215 150 C 195 130, 185 105, 205 98 C 218 95, 230 118, 228 140 Z" fill="url(#tq_reflect)" stroke="#ffffff" stroke-width="1.5"/>
    <text x="207" y="122" fill="#000" font-family="'Space Mono', monospace" font-size="7" font-weight="bold" transform="rotate(-40 207 122)">BB</text>

    <!-- Central Lateral Brand Stamp -->
    <text x="310" y="235" fill="#ffffff" font-family="'Syne', sans-serif" font-size="15" font-weight="800" letter-spacing="4">BALENCIAGA</text>
    <text x="310" y="249" fill="#888888" font-family="'Space Mono', monospace" font-size="8" letter-spacing="2">TRACK.1 — BEAUTY QUARTER</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="cardGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#222222" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#121212" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0c0c0c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="techGrid2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="450" fill="#0e0e0e"/>
  <rect width="600" height="450" fill="url(#techGrid2)"/>
  <circle cx="300" cy="225" r="210" fill="url(#cardGlow2)"/>

  <!-- Technical Overlay -->
  <g opacity="0.25">
    <circle cx="300" cy="225" r="160" fill="none" stroke="#ffffff" stroke-dasharray="3 6" stroke-width="1"/>
    <line x1="140" y1="225" x2="460" y2="225" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2 4"/>
    <line x1="300" y1="80" x2="300" y2="370" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2 4"/>
    <text x="310" y="95" fill="#ffffff" font-family="Space Mono, monospace" font-size="10" letter-spacing="2">VETEMENTS ARCHIVE // VNTG.02</text>
    <text x="150" y="370" fill="#ffffff" font-family="Space Mono, monospace" font-size="9" letter-spacing="1">GSM: 340 HEAVY WASHED JERSEY</text>
  </g>

  <!-- Boxy Oversized Tee Graphic -->
  <g transform="translate(90, 45) scale(0.7)">
    <!-- Dropped Tee Body -->
    <path d="M 180 150 L 80 230 L 140 290 L 195 240 L 190 480 L 410 480 L 405 240 L 460 290 L 520 230 L 420 150 C 370 180, 230 180, 180 150 Z" fill="#181818" stroke="#333333" stroke-width="2"/>
    
    <!-- Ribbed Crewneck Collar -->
    <path d="M 240 165 C 270 205, 330 205, 360 165 C 335 155, 265 155, 240 165 Z" fill="#121212" stroke="#555555" stroke-width="1.8"/>

    <!-- Subtle Faded Fabric Drape Folds -->
    <path d="M 210 240 Q 250 280, 230 360" stroke="#252525" stroke-width="3" fill="none"/>
    <path d="M 390 240 Q 350 280, 370 360" stroke="#252525" stroke-width="3" fill="none"/>
    <path d="M 270 320 Q 300 350, 330 320" stroke="#222222" stroke-width="2" fill="none"/>

    <!-- Front Tonal Brutalist Print -->
    <text x="300" y="270" text-anchor="middle" fill="#ffffff" font-family="Syne, sans-serif" font-size="28" font-weight="800" letter-spacing="8">VETEMENTS</text>
    <text x="300" y="295" text-anchor="middle" fill="#777777" font-family="Space Mono, monospace" font-size="11" letter-spacing="4">HAUTE COUTURE ARCHIVE</text>
    <line x1="220" y1="310" x2="380" y2="310" stroke="#444444" stroke-width="1"/>
    <text x="300" y="325" text-anchor="middle" fill="#555555" font-family="Space Mono, monospace" font-size="9" letter-spacing="2">EDITION 2026 // PARIS</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="cardGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#262626" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#141414" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0c0c0c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="techGrid3" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="450" fill="#0e0e0e"/>
  <rect width="600" height="450" fill="url(#techGrid3)"/>
  <circle cx="300" cy="225" r="210" fill="url(#cardGlow3)"/>

  <!-- Technical Reticle -->
  <g opacity="0.25">
    <circle cx="300" cy="225" r="160" fill="none" stroke="#ffffff" stroke-dasharray="3 6" stroke-width="1"/>
    <line x1="140" y1="225" x2="460" y2="225" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2 4"/>
    <text x="310" y="95" fill="#ffffff" font-family="Space Mono, monospace" font-size="10" letter-spacing="2">BALENCIAGA × FORTNITE // CAP.03</text>
    <text x="150" y="370" fill="#ffffff" font-family="Space Mono, monospace" font-size="9" letter-spacing="1">GEO: 6-PANEL TACTICAL COTTON</text>
  </g>

  <!-- 6-Panel Cap Graphic -->
  <g transform="translate(60, 45) scale(0.8)">
    <!-- Crown Dome -->
    <path d="M 140 260 C 140 130, 240 100, 360 100 C 480 100, 520 190, 520 260 C 470 270, 210 270, 140 260 Z" fill="#151515" stroke="#333333" stroke-width="2"/>
    
    <!-- Top Button -->
    <ellipse cx="355" cy="100" rx="14" ry="7" fill="#080808" stroke="#555555" stroke-width="1.5"/>

    <!-- Seam lines -->
    <path d="M 355 107 Q 350 180, 350 265" stroke="#2c2c2c" stroke-width="2.5" fill="none"/>
    <path d="M 355 107 Q 270 160, 220 260" stroke="#2c2c2c" stroke-width="2" fill="none"/>
    <path d="M 355 107 Q 440 160, 470 260" stroke="#2c2c2c" stroke-width="2" fill="none"/>

    <!-- Curved Visor Brim -->
    <path d="M 120 260 C 90 280, 60 300, 100 330 C 180 370, 380 370, 480 290 C 440 275, 360 260, 120 260 Z" fill="#1c1c1c" stroke="#444444" stroke-width="2"/>
    <path d="M 115 310 Q 280 355, 450 285" stroke="#383838" stroke-width="2" fill="none"/>
    <path d="M 135 295 Q 280 340, 430 275" stroke="#383838" stroke-width="1.8" fill="none"/>

    <!-- Embroidered Dual Monogram Front Patch -->
    <rect x="290" y="160" width="130" height="65" rx="6" fill="#0a0a0a" stroke="#ffffff" stroke-width="1.5"/>
    <text x="355" y="188" text-anchor="middle" fill="#ffffff" font-family="Syne, sans-serif" font-size="14" font-weight="bold" letter-spacing="2">FORTNITE</text>
    <line x1="310" y1="198" x2="400" y2="198" stroke="#444444" stroke-width="1"/>
    <text x="355" y="212" text-anchor="middle" fill="#888888" font-family="Space Mono, monospace" font-size="8" letter-spacing="1">BALENCIAGA</text>
  </g>
</svg>

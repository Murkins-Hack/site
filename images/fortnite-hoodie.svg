<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="cardGlow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242424" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#121212" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0c0c0c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="techGrid4" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="450" fill="#0e0e0e"/>
  <rect width="600" height="450" fill="url(#techGrid4)"/>
  <circle cx="300" cy="225" r="210" fill="url(#cardGlow4)"/>

  <!-- Technical Reticle -->
  <g opacity="0.25">
    <circle cx="300" cy="225" r="160" fill="none" stroke="#ffffff" stroke-dasharray="3 6" stroke-width="1"/>
    <line x1="140" y1="225" x2="460" y2="225" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2 4"/>
    <text x="310" y="95" fill="#ffffff" font-family="Space Mono, monospace" font-size="10" letter-spacing="2">FORTNITE COLLAB // HD.04</text>
    <text x="150" y="370" fill="#ffffff" font-family="Space Mono, monospace" font-size="9" letter-spacing="1">GSM: 600 FRENCH TERRY HEAVY</text>
  </g>

  <!-- Heavyweight Oversized Hoodie Graphic -->
  <g transform="translate(85, 40) scale(0.72)">
    <!-- Dropped Hoodie Torso & Sleeves -->
    <path d="M 180 145 L 70 240 L 125 310 L 185 255 L 180 470 L 420 470 L 415 255 L 475 310 L 530 240 L 420 145 Z" fill="#161616" stroke="#333333" stroke-width="2"/>
    
    <!-- Ribbed Hem Band & Cuffs -->
    <rect x="180" y="470" width="240" height="25" fill="#0d0d0d" stroke="#333333" stroke-width="1.5"/>
    <rect x="105" y="295" width="28" height="20" rx="2" transform="rotate(-35 119 305)" fill="#0d0d0d" stroke="#333333" stroke-width="1.5"/>
    <rect x="468" y="295" width="28" height="20" rx="2" transform="rotate(35 482 305)" fill="#0d0d0d" stroke="#333333" stroke-width="1.5"/>

    <!-- Kangaroo Front Pocket -->
    <path d="M 230 460 L 250 360 L 350 360 L 370 460 Z" fill="#121212" stroke="#444444" stroke-width="1.8"/>
    
    <!-- Sculpted Double-Layered Hood -->
    <path d="M 210 160 C 210 50, 270 50, 300 50 C 330 50, 390 50, 390 160 C 350 195, 250 195, 210 160 Z" fill="#1a1a1a" stroke="#444444" stroke-width="2"/>
    <path d="M 250 165 C 265 185, 335 185, 350 165 C 330 110, 270 110, 250 165 Z" fill="#0b0b0b" stroke="#333333" stroke-width="1.5"/>

    <!-- Front Silicone Heat-Press Graphic -->
    <text x="300" y="260" text-anchor="middle" fill="#ffffff" font-family="Syne, sans-serif" font-size="24" font-weight="800" letter-spacing="6">FORTNITE</text>
    <text x="300" y="280" text-anchor="middle" fill="#777777" font-family="Space Mono, monospace" font-size="10" letter-spacing="3">COLLABORATION ARCHIVE</text>
    <rect x="250" y="295" width="100" height="2" fill="#444444"/>
    <text x="300" y="315" text-anchor="middle" fill="#555555" font-family="Space Mono, monospace" font-size="8" letter-spacing="2">600GSM / NOIR</text>
  </g>
</svg>
